name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        run: |
          mkdir -p release
          GOOS=linux GOARCH=amd64 go build -o release/jobfinder-linux-amd64 ./cmd/jobfinder
          GOOS=linux GOARCH=arm64 go build -o release/jobfinder-linux-arm64 ./cmd/jobfinder
          GOOS=darwin GOARCH=amd64 go build -o release/jobfinder-darwin-amd64 ./cmd/jobfinder
          GOOS=darwin GOARCH=arm64 go build -o release/jobfinder-darwin-arm64 ./cmd/jobfinder
          GOOS=windows GOARCH=amd64 go build -o release/jobfinder-windows-amd64.exe ./cmd/jobfinder

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-linux-amd64
          asset_name: jobfinder-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-linux-arm64
          asset_name: jobfinder-linux-arm64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-darwin-amd64
          asset_name: jobfinder-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-darwin-arm64
          asset_name: jobfinder-darwin-arm64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-windows-amd64.exe
          asset_name: jobfinder-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -z "$(git tag --list)" ]; then
            echo "No previous tags found. Creating initial changelog." > CHANGELOG.md
          else
            git log --oneline --no-merges $(git describe --tags --abbrev=0)..HEAD | sed 's/^/- /' > CHANGELOG.md
          fi

      - name: Update Release with Changelog
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create_release.outputs.id }},
              body: changelog
            })
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-linux-amd64
          asset_name: jobfinder-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-linux-arm64
          asset_name: jobfinder-linux-arm64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-darwin-amd64
          asset_name: jobfinder-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-darwin-arm64
          asset_name: jobfinder-darwin-arm64
          asset_content_type: application/octet-stream

      - name: Upload Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/jobfinder-windows-amd64.exe
          asset_name: jobfinder-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Generate Changelog
        id: changelog
        run: |
          git log --oneline --no-merges $(git describe --tags --abbrev=0)..HEAD | sed 's/^/- /' > CHANGELOG.md

      - name: Update Release with Changelog
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create_release.outputs.id }},
              body: changelog
            });