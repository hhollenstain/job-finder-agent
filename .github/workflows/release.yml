name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "release/jobfinder-${os}-${arch}${ext}" ./cmd/jobfinder
          done
          (cd release && sha256sum jobfinder-* > checksums.txt)

      - name: Generate changelog
        run: |
          # Describe from the parent commit so the range starts at the previous tag,
          # not the tag that triggered this run.
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            git log --oneline --no-merges "${GITHUB_REF_NAME}" | sed 's/^/- /' > CHANGELOG.md
          else
            git log --oneline --no-merges "${prev}..${GITHUB_REF_NAME}" | sed 's/^/- /' > CHANGELOG.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
